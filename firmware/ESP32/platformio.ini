[env:nodemcu-32s]
platform = espressif32
board = nodemcu-32s
framework = arduino
monitor_speed = 115200
lib_deps =
  zinggjm/GxEPD2
  olikraus/U8g2_for_Adafruit_GFX
  adafruit/RTClib
  marcoschwartz/LiquidCrystal_I2C
  bblanchon/ArduinoJson
[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++11 -Isrc
